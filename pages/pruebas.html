<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/shop.css">
    <title>Pruebas</title>
</head>
<body>
    <form id="crearCuenta" action="">
 <input 
        type="text" 
        id="nombre" 
        placeholder="Nombre"
        required
    >

    <input 
        type="email" 
        id="email" 
        placeholder="Email"
        required
    >

    <input 
        type="password" 
        id="password" 
        placeholder="Contraseña"
        required
    >

    <button type="submit">Crear cuenta</button>





    </form>

    <form id="logearCuenta" action="">
 <input 
        type="text" 
        id="nombreSign" 
        placeholder="Nombre"
        required
    >

    <input 
        type="email" 
        id="emailSign" 
        placeholder="Email"
        required
    >

    <input 
        type="password" 
        id="passwordSign" 
        placeholder="Contraseña"
        required
    >

    <button type="submit">Iniciar sesion</button>





    </form>
    <div class="container"><img class="discodemierda" src="../img/wii-disco-login.png" alt=""></div>
    
<script src="index3.js"></script>
</body>
</html>
